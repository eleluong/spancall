# Default SpanCall (Lean flow) configuration

experiment:
  name: "spancall_baseline"
  seed: 42
  output_dir: "results"

data:
  # Multi-tool packing (build_input_multi, H1 over <|tool|> anchors) is now the
  # DEFAULT so H1 is actually trained against distractor candidate sets instead
  # of the old single-tool (pack_tools=1) path where tool_acc=1.0 was vacuous.
  pack_tools: 3
  # R0.4: the resolver's call budget. ``1`` makes multi-call predictions
  # structurally impossible, which pins call_exact_set_match / pred_n_calls_hist
  # to the single-call share regardless of model quality. 4 covers the observed
  # GT tail; call_min_prob / call_min_prob_ratio gate an extra call on H1.
  max_calls: 4
  call_min_prob: 0.25
  call_min_prob_ratio: 0.5
  recent:
    k_recent: 32
    context_budget_tokens: 4096
  sources:
    - name: "xlam"
      hub_id: "Salesforce/xlam-function-calling-60k"
      single_call_only: true
      local_path: null
      path: null
    - name: "glaive"
      path: null
    - name: "hermes"
      hub_id: "NousResearch/hermes-function-calling-v1"
      configs:
        - "func_calling_singleturn"
        - "func_calling"
        - "glaive_func_calling"
        - "json_mode_agentic"
        - "json_mode_singleturn"
      local_path: null
  stratum_mix:
    natural_f: 0.55
    paraphrase_f: 0.20
    swap_distractor_f: 0.10
    abstention_a: 0.15
  # 4-way schema-disjoint partition: train 80% / dev 5% / calib 5% /
  # test_ood_schema 10% (plan §2.3). dev/calib/OOD stay schema-disjoint from
  # train; test_id is a 10% utterance holdout within train schemas.
  schema_split:
    train_ratio: 0.80
    dev_ratio: 0.05
    calib_ratio: 0.05
    test_ood_schema_ratio: 0.10
    seed: 42
    id_holdout_ratio: 0.10

model:
  # Qwen3-0.6B embedding model, 32k context window, run with bidirectional
  # unmasked attention (encoder.is_causal=False). max_seq_len is the
  # resolver/trainer's guard, NOT a hardcoded 512 cap; the recent-context
  # budget (data.recent.*) manages what actually fills the window.
  backbone_name: "Qwen/Qwen3-Embedding-0.6B"
  head_dim: 256
  max_seq_len: 4096
  max_span_width: 16
  dropout: 0.1

optimization:
  learning_rate_encoder: 3.0e-5
  learning_rate_head: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  # `batch_size` is the MICRO batch; rows per OPTIMIZER step is
  # `effective_batch_size`, and the accumulation factor is DERIVED from the two
  # (accum = effective // micro). Before this, the two knobs were independent and
  # the Colab recipe ran bs=8 / accum=4 => effective 32 on ~3.9k rows = ~122
  # optimizer steps/epoch, which is why dev peaked at epoch 2 of 5 and then
  # decayed while train loss fell 17x. 128 is a sane full-finetune effective
  # batch; raise it before raising the LR.
  batch_size: 32
  effective_batch_size: 128
  # Length-bucketed cap for one micro batch. This used to be hardcoded
  # `bs * 1024`, so it silently changed meaning when bs changed and produced
  # 1-row batches that skewed the loss accounting.
  max_tokens_per_batch: 4096
  optimizer: "adamw"              # adamw | adamw_8bit (needs bitsandbytes)
  scheduler: "cosine_warmup"      # cosine_warmup | linear | constant
  # Cosine floor as a fraction of the peak LR. 0.0 = historical decay-to-zero,
  # which left the final epochs at ~1e-9 LR -- exactly when dev was decaying.
  min_lr_ratio: 0.10
  num_epochs: 4
  mixed_precision: "bf16"
  # Early stopping on the first eval split, and restoring the best epoch's
  # weights so the stage checkpoint is NOT the overfit final epoch.
  # patience=0 disables early stopping (old behaviour: run every epoch).
  early_stopping_patience: 1
  early_stopping_min_delta: 1.0e-4
  restore_best_on_exit: true
  # T3: keep only the top positive slot per param. Multi-positive (MAX_POS=3)
  # suppresses top-1 probability; MAX_POS=1 is the cheap ablation.
  max_pos: 1

training:
  gradient_accumulation_steps: 1

calibration:
  target_precision: 0.95
  confidence_level: 0.95
  temperature_scaling: true

clock:
  timezone: "UTC"              # IANA name; per-tenant default (D3). The template
                               # API itself never reads this or the wall clock —
                               # the caller resolves the user-local date via
                               # spancall.infer.clock.local_today and passes it
                               # as `now`, so a per-session override is free.
                               # "UTC" here is a documented fallback, NOT a silent
                               # guess: a caller with no known timezone must
                               # abstain on date params instead of calling
                               # local_today at all.

probe:                        # E0 traffic probe (D7)
  f_floor: 0.5                # provisional; derived from cost model: h_min / 0.6
  h_min: 0.3                  # smallest hit rate still giving >= 5x (E6 target)
  coverage_of_f: 0.6          # E2 coverage target over stratum F
  retriever_top_n: 5          # R@T top-N for the schema-selection mode in play (D6)

agent:
  mode: "router"               # llm_only, spancall_only, router, shadow
  integration: "s_skip"         # s_skip, s_inject, s_hint
  llm_model: "google/gemma-4"
  max_turns: 15
  max_context_tokens: 16384
  keep_last_tool_turns: 8
