[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spancall"
version = "0.1.0"
description = "SpanCall: Non-Autoregressive Extractive Function Calling via Multi-Span Extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0",
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]
model = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]
agent = [
    "pydantic>=2.0.0",
]
data = [
    "datasets>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["span_template*", "spancall*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".venv", "data", "results"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["archive", "notebooks", "data", "results"]
